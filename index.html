<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>J.A.R.V.I.S</h1>
    <p>SYSTEM ONLINE</p>
  </header>

  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="center"></div>
  </div>
  <div class="core-text">ARC REACTOR ACTIVE</div>

  <div class="status">
    <h2>SYSTEM DIAGNOSTICS</h2>
    <div class="row"><span>CORE TEMP</span><span class="on">NORMAL</span></div>
    <div class="row"><span>NETWORK</span><span class="on">SECURE</span></div>
  </div>

  <div class="chat" id="chat">
    <div class="msg ai">J.A.R.V.I.S: Systems operational. How may I assist you, Boss?</div>
  </div>

  <div class="input-area">
    <input type="text" id="msg" placeholder="Enter command..." autocomplete="off">
    <button id="send">SEND</button>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S Core</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#00ffff">

  <link rel="stylesheet" href="style.css?v=2026_siri_5s_hud">
</head>
<body>
  <div class="jarvis-container">
    <header class="top-bar">
      <div class="status-badge">ONLINE // 24/7</div>
      <button id="wakeToggleBtn" class="wake-btn" onclick="toggleWakeWord()">
        <span id="wakeStatusDot" class="dot"></span>
        <span id="wakeBtnText">Wake Mode: OFF</span>
      </button>
    </header>

    <main class="core-display">
      <div id="orbCore" class="orb-container">
        <div class="radar-sweep"></div>
        <div class="orb-glow"></div>
        <div class="orb-outer-reticle"></div>
        <div class="orb-ring"></div>
        <div class="orb-inner"></div>
      </div>

      <!-- Real-time Spectral Telemetry HUD -->
      <div class="hud-telemetry">
        <span id="hzLevelText">000 Hz</span>
        <div class="hud-signal-bar">
          <div id="hudSignalFill" class="hud-signal-fill"></div>
        </div>
        <span id="dbLevelText">-INF dB</span>
      </div>

      <div id="responseBox" class="terminal-box">Ready for command, Boss...</div>
      <div id="debugBox" class="debug-subtext">Waiting for audio input...</div>
    </main>

    <!-- Siri Push-to-Talk Interactive Button -->
    <footer class="bottom-bar">
      <div class="siri-button-wrapper">
        <div class="siri-halo-ring"></div>
        <button id="siriSpeakBtn" class="siri-speak-btn" aria-label="Activate Jarvis">
          <div class="siri-core-wave"></div>
          <span class="mic-icon">🎙️</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Universal Multi-App HUD Modal -->
  <div id="universalAppModal" class="floating-hud-modal">
    <div class="hud-header">
      <span id="appHudTitle">SYSTEM APP // ACTIVE</span>
      <div class="hud-controls">
        <a id="appPipLink" href="#" target="_blank" class="pip-btn">[OPEN APP]</a>
        <button class="hud-close-btn" onclick="closeUniversalApp()">✕</button>
      </div>
    </div>
    <div class="hud-body">
      <iframe 
        id="appHudFrame" 
        src="" 
        allow="autoplay; encrypted-media; picture-in-picture; geolocation; camera; microphone" 
        allowfullscreen 
        loading="lazy">
      </iframe>
    </div>
  </div>

  <script src="script.js?v=2026_siri_5s_hud"></script>
</body>
</html>

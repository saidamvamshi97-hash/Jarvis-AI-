<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-container">
    <header>
      <h1>J.A.R.V.I.S</h1>
      <p>SYSTEM ONLINE</p>
    </header>

    <div class="reactor-wrapper">
      <div class="core" id="arc-core">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="center"></div>
      </div>
      <div class="core-text">ARC REACTOR ACTIVE</div>
    </div>

    <div class="status-panel">
      <h2>SYSTEM DIAGNOSTICS</h2>
      <div class="status-row"><span>CORE TEMP</span><span class="status-val on">NORMAL</span></div>
      <div class="status-row"><span>NETWORK</span><span class="status-val on">SECURE</span></div>
      <div class="status-row" id="battery-row"><span>POWER LEVEL</span><span class="status-val on">ONLINE</span></div>
    </div>

    <div class="terminal-chat" id="chat">
      <div class="msg ai"><span class="prefix">J.A.R.V.I.S:</span> Systems operational. How may I assist you, Boss?</div>
    </div>

    <div class="control-bar">
      <input type="text" id="msg" placeholder="Enter command..." autocomplete="off">
      <button id="mic" title="Voice Command">🎤</button>
      <button id="send">SEND</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

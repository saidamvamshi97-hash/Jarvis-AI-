<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S Core MK-VIII</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="jarvis-container">
    <header class="top-bar">
      <div class="telemetry-pill">
        <span class="pulse-indicator"></span>
        <span id="sysStatus">COPILOT // MK-VIII</span>
      </div>
      <button id="wakeToggleBtn" class="wake-btn" onclick="toggleWakeWord()">
        <span id="wakeStatusDot" class="dot"></span>
        <span id="wakeBtnText">Wake Mode: OFF</span>
      </button>
    </header>

    <!-- Holographic Telemetry Diagnostics Grid -->
    <div class="hud-top-telemetry">
      <div class="stat-block"><span class="stat-label">PWR</span><span id="batteryStat">--%</span></div>
      <div class="stat-block"><span class="stat-label">SPEED</span><span id="speedStat" style="color: #00ffff; font-weight: bold;">0 KM/H</span></div>
      <div class="stat-block"><span class="stat-label">MODE</span><span id="modeStat">CRUISE</span></div>
    </div>

    <main class="core-display">
      <div id="orbCore" class="orb-container">
        <div class="radar-sweep"></div>
        <div class="orb-glow"></div>
        <div class="orb-outer-reticle"></div>
        <div class="orb-ring"></div>
        <div class="orb-inner"></div>
      </div>

      <div class="hud-telemetry">
        <span id="hzLevelText">000 Hz</span>
        <div class="hud-signal-bar">
          <div id="hudSignalFill" class="hud-signal-fill"></div>
        </div>
        <span id="dbLevelText">-INF dB</span>
      </div>

      <div id="responseBox" class="terminal-box">Ready for command, Boss...</div>
      <div id="debugBox" class="debug-subtext">GPS Speedometer & Radar Online...</div>
    </main>

    <footer class="bottom-bar">
      <div class="siri-button-wrapper">
        <div class="siri-halo-ring"></div>
        <button id="siriSpeakBtn" class="siri-speak-btn" aria-label="Activate Jarvis">
          <span class="mic-icon">🎙️</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Universal Modal HUD with Triple-Tap Fullscreen (Hidden by default) -->
  <div id="universalAppModal" class="floating-hud-modal" style="display: none;">
    <div class="hud-header">
      <span id="appHudTitle">SYSTEM APP // ACTIVE</span>
      <div class="hud-controls">
        <a id="appPipLink" href="#" target="_blank" class="pip-btn">[OPEN APP]</a>
        <button class="hud-close-btn" onclick="closeUniversalApp()">✕</button>
      </div>
    </div>
    <div class="hud-body">
      <iframe id="appHudFrame" src="" allow="autoplay; encrypted-media; picture-in-picture; geolocation" allowfullscreen></iframe>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S. MK-VIII</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #071524 0%, #02070e 100%);
      color: #00f2fe;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px;
      overflow: hidden;
    }

    .hud-header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-badge {
      border: 1px solid rgba(0, 242, 254, 0.4);
      background: rgba(0, 242, 254, 0.05);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: #00f2fe;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f2fe;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .telemetry-row {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(0, 242, 254, 0.15);
      border-bottom: 1px solid rgba(0, 242, 254, 0.15);
      padding: 10px 0;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .stat-label {
      color: rgba(0, 242, 254, 0.5);
      margin-right: 4px;
    }

    .stat-val {
      font-weight: 600;
    }

    .reactor-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      position: relative;
    }

    .reactor-ring-outer {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 242, 254, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rotateRing 20s linear infinite;
    }

    .reactor-ring-inner {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 1px solid rgba(0, 242, 254, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
    }

    .reactor-core {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f2fe 0%, #0088cc 80%);
      box-shadow: 0 0 50px #00f2fe, 0 0 80px rgba(0, 242, 254, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .reactor-core.listening {
      animation: pulseCore 1s infinite alternate;
      box-shadow: 0 0 70px #00f2fe, 0 0 100px #00f2fe;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseCore {
      from { transform: scale(0.95); opacity: 0.8; }
      to { transform: scale(1.1); opacity: 1; }
    }

    .meter-display {
      margin-top: 24px;
      font-size: 12px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(0, 242, 254, 0.7);
    }

    .meter-bar {
      width: 90px;
      height: 2px;
      background: rgba(0, 242, 254, 0.4);
      position: relative;
    }

    .meter-fill {
      width: 30%;
      height: 100%;
      background: #00f2fe;
      box-shadow: 0 0 6px #00f2fe;
      transition: width 0.1s;
    }

    .hud-console {
      margin-top: 20px;
      text-align: center;
      max-width: 400px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .primary-msg {
      font-size: 16px;
      color: #ffffff;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      line-height: 1.4;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
    }

    .sub-msg {
      font-size: 12px;
      color: rgba(0, 242, 254, 0.65);
      letter-spacing: 1px;
      min-height: 16px;
    }

    .controls-container {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mic-button {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle, #082138 0%, #030d17 100%);
      border: 1.5px solid #00f2fe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: all 0.25s ease;
    }

    .mic-button:active {
      transform: scale(0.92);
    }

    .mic-button.active {
      border-color: #ff3366;
      box-shadow: 0 0 30px #ff3366;
    }

    .mic-button svg {
      width: 28px;
      height: 28px;
      fill: #00f2fe;
      transition: fill 0.2s;
    }

    .mic-button.active svg {
      fill: #ff3366;
    }
  </style>
</head>
<body>

  <div class="hud-header">
    <div class="hud-badge">
      <div class="badge-dot"></div>
      <span id="systemModeTag">COPILOT // MK-VIII</span>
    </div>
    <div class="hud-badge" id="wakeBadge">
      <div class="badge-dot" id="wakeDot" style="background:#00f2fe;"></div>
      <span id="wakeStatus">LOCK: ON</span>
    </div>
  </div>

  <div class="telemetry-row">
    <div><span class="stat-label">PWR</span><span class="stat-val" id="pwrVal">--%</span></div>
    <div><span class="stat-label">SPEED</span><span class="stat-val" id="speedVal">0 KM/H</span></div>
    <div><span class="stat-label">MODE</span><span class="stat-val" id="modeVal">CRUISE</span></div>
  </div>

  <div class="reactor-container">
    <div class="reactor-ring-outer">
      <div class="reactor-ring-inner">
        <div class="reactor-core" id="reactorCore"></div>
      </div>
    </div>

    <div class="meter-display">
      <span id="hzVal">000 Hz</span>
      <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
      <span id="dbVal">-INF dB</span>
    </div>

    <div class="hud-console">
      <div class="primary-msg" id="primaryMsg">Ready for command, Boss.</div>
      <div class="sub-msg" id="subMsg">Tap microphone to initiate voice query</div>
    </div>
  </div>

  <div class="controls-container">
    <button class="mic-button" id="micBtn" aria-label="Microphone">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
  </div>

  <script>
    const WORKER_URL = "https://jarvis-automation.saidamvamshi97.workers.dev";

    const micBtn = document.getElementById("micBtn");
    const reactorCore = document.getElementById("reactorCore");
    const primaryMsg = document.getElementById("primaryMsg");
    const subMsg = document.getElementById("subMsg");
    const speedVal = document.getElementById("speedVal");
    const modeVal = document.getElementById("modeVal");
    const pwrVal = document.getElementById("pwrVal");
    const meterFill = document.getElementById("meterFill");
    const dbVal = document.getElementById("dbVal");
    const hzVal = document.getElementById("hzVal");
    const wakeStatus = document.getElementById("wakeStatus");

    let isListening = false;
    let recognition = null;
    let currentSpeed = 0;
    let currentLat = null;
    let currentLon = null;
    let lastLat = null;
    let lastLon = null;
    let lastTime = null;
    let manualTrainMode = false;
    let transitAlertFired = false;

    // 1. Screen Wake Lock (Prevents sleep in background)
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          const lock = await navigator.wakeLock.request("screen");
          wakeStatus.innerText = "LOCK: ON";
          lock.addEventListener("release", () => {
            wakeStatus.innerText = "LOCK: REL";
          });
        }
      } catch (e) {
        wakeStatus.innerText = "LOCK: N/A";
      }
    }
    requestWakeLock();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });

    // 2. Battery Meter
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        pwrVal.innerText = `${Math.round(b.level * 100)}%`;
      });
    }

    // 3. Haversine Distance & Velocity
    function calculateSpeed(lat1, lon1, lat2, lon2, seconds) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return ((R * c) / seconds) * 3.6;
    }

    // 4. Geolocation Watcher
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const now = Date.now();
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          let calculatedSpeed = 0;

          if (pos.coords.speed !== null && !isNaN(pos.coords.speed) && pos.coords.speed > 0) {
            calculatedSpeed = Math.round(pos.coords.speed * 3.6);
          } else if (lastLat !== null && lastTime !== null) {
            const timeDiff = (now - lastTime) / 1000;
            if (timeDiff >= 1.5) {
              calculatedSpeed = Math.round(calculateSpeed(lastLat, lastLon, currentLat, currentLon, timeDiff));
            }
          }

          lastLat = currentLat;
          lastLon = currentLon;
          lastTime = now;

          currentSpeed = calculatedSpeed;
          speedVal.innerText = `${calculatedSpeed} KM/H`;

          // Mode Trigger: Train vs Highway
          if (manualTrainMode || calculatedSpeed >= 50) {
            if (manualTrainMode) {
              modeVal.innerText = "TRAIN";
              modeVal.style.color = "#00f2fe";
            } else if (calculatedSpeed >= 60) {
              modeVal.innerText = "HIGHWAY";
              modeVal.style.color = "#ff3366";
            }

            if (!transitAlertFired && calculatedSpeed >= 50) {
              transitAlertFired = true;
              const endpoint = manualTrainMode ? "/api/train/auto-radar" : "/api/highway/auto-alert";
              fetch(`${WORKER_URL}${endpoint}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                keepalive: true,
                body: JSON.stringify({
                  lat: currentLat,
                  lon: currentLon,
                  speed: calculatedSpeed
                })
              }).catch(() => {});
            }
          } else {
            modeVal.innerText = "CRUISE";
            modeVal.style.color = "#00f2fe";
            if (calculatedSpeed < 30) transitAlertFired = false;
          }
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 6000 }
      );
    }

    // 5. Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-IN";

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("active");
        reactorCore.classList.add("listening");
        primaryMsg.innerText = "Listening...";
        subMsg.innerText = "Speak now...";
        meterFill.style.width = "75%";
        dbVal.innerText = "-24 dB";
        hzVal.innerText = "440 Hz";
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript.trim();

        if (!transcript) {
          primaryMsg.innerText = "Ready for command, Boss.";
          subMsg.innerText = "No voice detected. Tap to try again.";
          return;
        }

        primaryMsg.innerText = `"${transcript}"`;
        subMsg.innerText = "Consulting J.A.R.V.I.S brain...";

        const lower = transcript.toLowerCase();

        // Voice Command: Activate Train Mode
        if (lower.includes("train mode") || lower.includes("i am on train") || lower.includes("on a train")) {
          manualTrainMode = true;
          modeVal.innerText = "TRAIN";
          modeVal.style.color = "#00f2fe";
          speak("Train navigation mode engaged, Boss. Telemetry tracking active.");
          primaryMsg.innerText = "Train Navigation Mode: ACTIVE";
          subMsg.innerText = "Railway corridor telemetry enabled";

          if (currentLat && currentLon) {
            fetch(`${WORKER_URL}/api/train/auto-radar`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              keepalive: true,
              body: JSON.stringify({ lat: currentLat, lon: currentLon, speed: currentSpeed })
            }).catch(() => {});
          }
          return;
        }

        // Voice Command: Manual Alert
        if (lower.includes("send alert") || lower.includes("alert")) {
          primaryMsg.innerText = "Transmitting alert...";
          subMsg.innerText = "Sending Telegram packet";

          try {
            await fetch(`${WORKER_URL}/api/telegram/alert`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              keepalive: true,
              body: JSON.stringify({
                message: `🚨 *Manual J.A.R.V.I.S Alert*\nStatus: ${modeVal.innerText} Mode\nVelocity:${currentSpeed} km/h\nLocation: \`${currentLat}, ${currentLon}\``
              })
            });
            speak("Telemetry dispatched to your Telegram, Boss.");
            primaryMsg.innerText = "Alert dispatched successfully, Boss.";
          } catch (e) {
            primaryMsg.innerText = "Failed to dispatch alert.";
          }
          return;
        }

        // Route all general queries to Worker
        try {
          const res = await fetch(`${WORKER_URL}/api/ask`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: transcript })
          });

          const data = await res.json();
          const reply = data.reply || "Systems fully functional, Boss.";

          primaryMsg.innerText = reply;
          subMsg.innerText = "AI Online";
          speak(reply);
        } catch (err) {
          primaryMsg.innerText = "Cloud connection issue.";
          subMsg.innerText = err.message;
          speak("Link fault encountered, Boss.");
        }
      };

      recognition.onerror = (e) => {
        isListening = false;
        micBtn.classList.remove("active");
        reactorCore.classList.remove("listening");
        meterFill.style.width = "10%";
        dbVal.innerText = "-INF dB";
        hzVal.innerText = "000 Hz";

        if (e.error === "no-speech") {
          primaryMsg.innerText = "No speech detected, Boss.";
          subMsg.innerText = "Tap the mic and speak clearly.";
        } else {
          primaryMsg.innerText = "Microphone paused.";
          subMsg.innerText = `Status: ${e.error}`;
        }
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("active");
        reactorCore.classList.remove("listening");
        meterFill.style.width = "20%";
        dbVal.innerText = "-INF dB";
      };
    }

    micBtn.addEventListener("click", () => {
      requestWakeLock();
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    });

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.05;
      utterance.pitch = 0.95;
      const voices = window.speechSynthesis.getVoices();
      const engVoice = voices.find(v => v.lang.includes("en-IN") || v.name.includes("India")) || voices.find(v => v.lang.includes("en"));
      if (engVoice) utterance.voice = engVoice;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>

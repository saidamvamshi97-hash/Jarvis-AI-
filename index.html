<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S Core</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#00ffff">

  <link rel="stylesheet" href="style.css?v=20261011_hud">
</head>
<body>
  <div class="jarvis-container">
    <header class="top-bar">
      <div class="status-badge">ONLINE // 24/7</div>
      <button id="wakeToggleBtn" class="wake-btn" onclick="toggleWakeWord()">
        <span id="wakeStatusDot" class="dot"></span>
        <span id="wakeBtnText">Wake Mode: OFF</span>
      </button>
    </header>

    <main class="core-display">
      <div id="orbCore" class="orb-container">
        <div class="orb-glow"></div>
        <div class="orb-ring"></div>
        <div class="orb-inner"></div>
      </div>
      <div id="responseBox" class="terminal-box">Ready for command, Boss...</div>
      <div id="debugBox" style="font-size: 11px; color: rgba(0,255,255,0.6); margin-top: 8px;">Waiting for audio input...</div>
    </main>

    <footer class="bottom-bar">
      <button class="manual-mic-btn" onclick="triggerManualListening()">🎤 Speak</button>
    </footer>
  </div>

  <!-- 1. Floating YouTube Music HUD Window -->
  <div id="floatingMusicModal" class="floating-hud-modal">
    <div class="hud-header">
      <span id="musicTitle">AUDIO STREAM // ACTIVE</span>
      <button class="hud-close-btn" onclick="closeFloatingMusic()">✕</button>
    </div>
    <div class="hud-body">
      <iframe id="musicFrame" src="" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>
    </div>
  </div>

  <!-- 2. Floating Navigation HUD Overlay -->
  <div id="floatingMapModal" class="floating-hud-modal">
    <div class="hud-header">
      <span id="mapTitle">NAVIGATION HUD // ACTIVE</span>
      <button class="hud-close-btn" onclick="closeFloatingMap()">✕</button>
    </div>
    <div class="hud-body">
      <iframe id="mapFrame" src="" allowfullscreen loading="lazy"></iframe>
    </div>
  </div>

  <script src="script.js?v=20261011_hud"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S - Mobile Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-container">
    <!-- Header -->
    <header>
      <h1>J.A.R.V.I.S</h1>
      <p class="subtitle">MOBILE EDITION</p>
    </header>

    <!-- Arc Reactor -->
    <div class="core-wrapper">
      <div class="reactor">
        <div class="ring outer-ring"></div>
        <div class="ring mid-ring"></div>
        <div class="ring inner-ring"></div>
        <div class="center-glow"></div>
      </div>
      <div class="core-status">CORE ACTIVE</div>
    </div>

    <!-- System Status Panel -->
    <div class="hud-box status-panel">
      <div class="panel-header">SYSTEM STATUS</div>
      <div class="status-grid">
        <div class="status-row">
          <span class="label">AI CORE</span>
          <span class="badge online">● ONLINE</span>
        </div>
        <div class="status-row">
          <span class="label">NETWORK</span>
          <span class="badge online">● ONLINE</span>
        </div>
        <div class="status-row">
          <span class="label">VOICE</span>
          <span class="badge online" id="voice-status">● ONLINE</span>
        </div>
        <div class="status-row">
          <span class="label">MEMORY</span>
          <span class="badge online" id="memory-status">● ONLINE</span>
        </div>
      </div>
    </div>

    <!-- Chat / Output Console -->
    <div class="hud-box chat-console" id="chat">
      <div class="msg ai">
        <strong>J.A.R.V.I.S:</strong> Systems operational. How may I assist you, Boss?
      </div>
    </div>

    <!-- Controls -->
    <div class="input-panel">
      <input type="text" id="msg" placeholder="Ask JARVIS..." autocomplete="off">
      <button id="mic" title="Voice Input">🎤</button>
      <button id="send">SEND</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
